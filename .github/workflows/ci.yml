name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      soklet_ref:
        description: Soklet repository ref to install before building soklet-otel
        required: false
        default: master

# Cancel superseded runs on the same ref to save time and reduce noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the 21/25 jobs if 17 fails — we want every JDK's result.
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25']
    steps:
      - name: Check out soklet-otel
        uses: actions/checkout@v6
        with:
          path: soklet-otel

      - name: Check out soklet
        uses: actions/checkout@v6
        with:
          repository: soklet/soklet
          ref: ${{ inputs.soklet_ref || 'master' }}
          path: soklet

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Install checked-out Soklet
        run: mvn -B -ntp -f soklet/pom.xml -DskipTests -Dgpg.skip=true install

      - name: Resolve checked-out Soklet version
        id: soklet-version
        shell: bash
        run: echo "version=$(mvn -q -f soklet/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: mvn -B -ntp -f soklet-otel/pom.xml -Dsoklet.version=${{ steps.soklet-version.outputs.version }} test

      - name: Build Javadoc
        run: mvn -B -ntp -f soklet-otel/pom.xml -Dsoklet.version=${{ steps.soklet-version.outputs.version }} javadoc:javadoc
